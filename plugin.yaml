name: incognito
version: "1.0.0"
manifest_version: 2
api_version: 1
requires_hermes: ">=0.22.0"
author: Nicolas Buelvas
license: MIT
homepage: https://github.com/nicolasbuelvas/hermes-incognito
description: >-
  Ephemeral and incognito sessions for Hermes CLI, TUI, Gateway, and
  Desktop: hides active chats from sidebars and listings, blocks persistent
  memory and skill mutations, strips profile memory in strict mode, optionally
  redacts outbound PII in RAM, and scrubs SQLite compression chains and
  transcript artifacts on close or on a sweep after TTL expiry.
tags:
  - privacy
  - incognito
  - ephemeral
  - sessions
  - security
  - desktop
provides_tools:
  - incognito_control
  - incognito_verify
provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_tool_call
  - subagent_start
  - post_compaction
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - transform_tool_result
provides_middleware:
  - llm_request
  - llm_execution
config_schema:
  default_mode:
    type: str
    choices:
      - "off"
      - standard
      - strict
    default: "off"
    label: Default session mode
    description: Start every new session in off, standard incognito, or strict clean-room mode.
  auto_purge_on_exit:
    type: bool
    default: true
    label: Purge session on close
    description: Automatically delete SQLite rows, compression continuations, and session files when an incognito chat ends.
  default_ttl_minutes:
    type: int
    default: 60
    label: Idle TTL (minutes)
    description: Idle minutes before an incognito session becomes eligible for cleanup on the next sweep (0 disables TTL).
  redact_outbound_pii:
    type: bool
    default: false
    label: Mask personal details
    description: Replace emails, phones, cards, IBANs, IDs (cédula/NIT/SSN), IPs, passwords, API keys, and street addresses with placeholders like [EMAIL_1] before anything is sent to a model. Sends that can't be checked are blocked.
  provider_zdr_hints:
    type: bool
    default: true
    label: Send provider privacy hints
    description: Attach non-retention hints where supported by compatible providers.
  zero_fill_files:
    type: bool
    default: true
    label: Zero-fill files before deletion
    description: Overwrite transcript JSONL and hook spill files with zero bytes prior to unlinking.
  save_undo_minutes:
    type: int
    default: 10
    label: Undo window after saving (minutes)
    description: How long a chat saved from Incognito can still be returned to Incognito. Closing the chat ends it sooner.
